[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pilab"
version = "0.1.0"
description = "LLM-powered speech transcription tool"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "sounddevice",
    "pysilero-vad",
    "openai",
    "python-dotenv",
    "pyyaml",
    "textual",
]

[project.scripts]
reshka = "reshka_tui:main"
reshka-tui = "reshka_tui:main"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "ruff>=0.15.13",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.hatch.build.targets.wheel]
packages = ["."]
